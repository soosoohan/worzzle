<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K1</title>

<style>
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: #FFF2EB;
    margin: 0;
    padding: 20px;
    color: #7A2E2E;
    text-align: center;
  }

  h1 {
    font-size: clamp(1.3rem, 3.7vw, 1.9rem);
    margin-bottom: 10px;
    font-weight: bold;
    color: #FF9494;
  }

  p {
    font-size: clamp(1rem, 3vw, 1.3rem);
    margin-bottom: 20px;
    color: #A65A5A;
  }

  .game-button {
    font-size: clamp(1rem, 3vw, 1.3rem);
    background-color: #FFD6BA;
    padding: 10px 22px;
    margin: 8px;
    color: #7A2E2E;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .game-button:hover {
    background-color: #FF9494;
    color: white;
    transform: scale(1.05);
  }

  .container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 500px;
  }

  .cell {
    width: 50px;
    height: 50px;
    background-color: #FFFFFF;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    cursor: pointer;
    user-select: none;
    border: 2px solid #C89A7B;
    line-height: 1;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }

  .cell:hover {
    background-color: #E8D5C4;
    transform: scale(1.05);
  }

  .revealed {
    background-color: #FFFFFF;
    border-color: #A67C52;
  }

  .word-owned-user {
    background-color: #FFB3D9 !important;
    border-color: #FF69B4 !important;
    font-weight: bold;
  }

  .word-owned-computer {
    background-color: #B3E5FF !important;
    border-color: #4A90E2 !important;
    font-weight: bold;
  }

  #userScore, #computerScore {
    width: 160px;
    min-height: 300px;
    padding: 10px;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #7A2E2E;
    border: 2px solid #C89A7B;
    border-radius: 8px;
  }

  #userScore {
    background-color: #FFB3D9;
  }

  #computerScore {
    background-color: #B3E5FF;
  }

  #userScore h3, #computerScore h3 {
    margin-top: 0;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #7A2E2E;
  }

  #userScore p, #computerScore p {
    margin: 1px 0;
    padding: 2px 5px;
    background-color: rgba(255, 255, 255, 0.5);
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    line-height: 1.2;
    border-radius: 3px;
  }

  #currentTurn {
    font-size: 20px;
    margin: 10px;
    color: #7A2E2E;
    font-weight: bold;
  }

  #game {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    padding: 10px;
    background-color: #C89A7B;
    border: 3px solid #A67C52;
    border-radius: 12px;
    width: 500px;
    height: 500px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    margin: 0 auto;
  }

  .controls {
    margin-top: 20px;
  }

  .mobile-scores {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
    width: 100%;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  #userScore-mobile, #computerScore-mobile {
    width: 100%;
    min-height: 120px;
    padding: 15px;
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-weight: bold;
    border: 2px solid #7A2E2E;
    border-radius: 8px;
    color: #7A2E2E;
    box-sizing: border-box;
  }

  #userScore-mobile {
    background-color: #FFB3D9;
  }

  #computerScore-mobile {
    background-color: #B3E5FF;
  }

  #userScore-mobile h3, #computerScore-mobile h3 {
    margin-top: 0;
    font-size: clamp(1rem, 3vw, 1.3rem);
  }

  #userScore-mobile p, #computerScore-mobile p {
    margin: 1px 0;
    padding: 2px 3px;
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 3px;
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    line-height: 1.2;
  }

  .hidden {
    display: none;
  }

  /* 모바일 반응형 */
  @media (max-width: 768px) {
    body {
      padding: 10px;
    }

    .container {
      display: none !important;
    }

    #userScore, #computerScore {
      display: none !important;
    }

    .mobile-scores {
      display: flex !important;
    }

    #game {
      grid-template-columns: repeat(7, 1fr);
      width: 90vw;
      height: 90vw;
      max-width: 400px;
      max-height: 400px;
      margin: 0 auto;
      padding: 8px;
      gap: 1px;
    }

    .cell {
      font-size: 18px;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      border-width: 1px;
    }

    #currentTurn {
      font-size: clamp(1rem, 3vw, 1.3rem);
      margin: 8px;
    }

    .game-button {
      font-size: clamp(1rem, 3vw, 1.3rem);
      padding: 8px 16px;
      margin: 5px;
    }

    .controls {
      margin-top: 15px;
    }
  }

  /* 데스크톱에서 모바일 점수판 숨기기 */
  @media (min-width: 769px) {
    .mobile-scores {
      display: none !important;
    }
  }
</style>

</head>

<body>
  <h1 id="game-title">게임 제목</h1>
  <p id="game-desc">게임 설명</p>

  <div class="game-container">
    <div id="gameSection" class="hidden">
      <div id="currentTurn"></div>


  <div class="container">
    <div id="computerScore">
      <h3>컴퓨터:</h3>
    </div>
    <div id="game"></div>
    <div id="userScore">
      <h3>사용자:</h3>
    </div>
  </div>

  <!-- 모바일용 점수판 -->
  <div class="mobile-scores">
    <div id="computerScore-mobile">
      <h3>컴퓨터:</h3>
    </div>
    <div id="userScore-mobile">
      <h3>사용자:</h3>
    </div>
  </div>

  <div class="controls">
    <button id="retryBtn" class="game-button">다시 하기</button>
    <button onclick="location.href='index.html'" class="game-button">초기 화면</button>
  </div>
</div>


  </div>

  <script>
    const gridSize = 7;
    const totalCells = gridSize * gridSize;

    let board, revealed, wordMap, foundWords, currentPlayer, foundBy, words, usedIndexes;
    let clovers = new Set(), daisies = new Set();
    let resultShown = false;
    let npcTimeoutId = null;

    const gameEl = document.getElementById('game');
    const userScoreEl = document.getElementById('userScore');
    const computerScoreEl = document.getElementById('computerScore');
    const userScoreMobileEl = document.getElementById('userScore-mobile');
    const computerScoreMobileEl = document.getElementById('computerScore-mobile');
    const retryBtn = document.getElementById('retryBtn');
    const gameSection = document.getElementById('gameSection');
    const currentTurnEl = document.getElementById('currentTurn');

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const poolFile = urlParams.get('pool');
      
      if (!poolFile) {
        const testData = {
          title: '테스트 게임',
          description: '테스트용 단어 찾기 게임입니다.',
          words: {
            '3': ['가나다', '라마바', '사아자'],
            '4': ['차카타', '파하거', '너도서'],
            '5': ['어여오요', '우유이지']
          },
          wordCount: {
            '3': 2,
            '4': 2,
            '5': 1
          }
        };
        
        initializeGame(testData);
        return;
      }

      fetch('wordpools/' + poolFile + '.json')
        .then(res => res.json())
        .then(data => {
          initializeGame(data);
        })
        .catch(err => {
          console.error('워드풀 로딩 실패:', err);
          const testData = {
            title: '테스트 게임',
            description: '워드풀 로딩에 실패했습니다. 테스트 데이터를 사용합니다.',
            words: {
              '3': ['가나다', '라마바', '사아자'],
              '4': ['차카타', '파하거', '너도서'],
              '5': ['어여오요', '우유이지']
            },
            wordCount: {
              '3': 2,
              '4': 2,
              '5': 1
            }
          };
          initializeGame(testData);
        });
    };

    function initializeGame(data) {
      document.getElementById('game-title').textContent = data.title || '게임 제목';
      const rawText = data.description || '게임 설명';
      const htmlText = rawText.replace(/\n/g, '<br>');
      document.getElementById('game-desc').innerHTML = htmlText;

      words = [];
      for (let length in data.words) {
        const count = data.wordCount[length] || 0;
        words.push(...getRandomSample(data.words[length], count));
      }
      
      gameSection.classList.remove('hidden');
      init();
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function getRandomSample(arr, count) {
      if (count >= arr.length) return [...arr];
      const shuffled = [...arr];
      shuffle(shuffled);
      return shuffled.slice(0, count);
    }

    function init() {
      board = Array(totalCells).fill(null);
      revealed = Array(totalCells).fill(false);
      wordMap = {};
      foundWords = new Set();
      foundBy = { user: [], computer: [] };
      currentPlayer = 'user';
      usedIndexes = new Set();
      clovers.clear();
      daisies.clear();
      resultShown = false;

      if (npcTimeoutId) {
        clearTimeout(npcTimeoutId);
        npcTimeoutId = null;
      }

      createGrid();
      
      if (placeAllWordsWithVariety()) {
        console.log('모든 단어가 성공적으로 배치되었습니다');
      } else {
        let placedWords = [];
        shuffle(words);
        
        for (let word of words) {
          let placed = false;
          for (let attempt = 0; attempt < 500; attempt++) {
            if (placeWord(word)) {
              placedWords.push(word);
              placed = true;
              break;
            }
          }
          if (!placed) {
            console.log('배치 실패한 단어:', word);
          }
        }
        console.log('실제 배치된 단어 수:', placedWords.length);
      }
      
      placeDaisies(4);
      placeClovers(8);
      fillEmptyCells();
      updateScore();
      updateTurnDisplay();
      checkGameEnd();
    }

    function createGrid() {
      gameEl.innerHTML = '';
      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.onclick = () => { if (!resultShown) handleClick(i); };
        gameEl.appendChild(cell);
      }
    }

    function canPlaceWord(word, x, y, dx, dy) {
      for (let i = 0; i < word.length; i++) {
        let nx = x + dx * i, ny = y + dy * i;
        if (nx < 0 || ny < 0 || nx >= gridSize || ny >= gridSize) return false;
        
        let idx = ny * gridSize + nx;
        if (board[idx] && board[idx] !== word[i]) return false;
        if (usedIndexes.has(idx)) return false;
      }
      return true;
    }

    function placeWord(word) {
      const directions = [
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: 1, y: 1 },
      ];
      
      const shuffledDirections = directions.sort(() => Math.random() - 0.5);
     
      for (let dir of shuffledDirections) {
        const startY = Math.floor(Math.random() * gridSize);
        for (let i = 0; i < gridSize; i++) {
          const y = (startY + i) % gridSize;
          for (let x = 0; x < gridSize; x++) {
            if (canPlaceWord(word, x, y, dir.x, dir.y)) {
              let positions = [];
              for (let i = 0; i < word.length; i++) {
                let nx = x + dir.x * i, ny = y + dir.y * i, idx = ny * gridSize + nx;
                board[idx] = word[i];
                usedIndexes.add(idx);
                positions.push(idx);
              }
              wordMap[word] = {
                positions: positions,
                direction: [dir.x, dir.y]
              };
              return true;
            }
          }
        }
      }
      return false;
    }

    function checkDirectionVariety() {
      let directionCount = { '1,0': 0, '0,1': 0, '1,1': 0 };
      
      for (let word in wordMap) {
        const direction = wordMap[word].direction;
        const key = direction[0] + ',' + direction[1];
        if (directionCount.hasOwnProperty(key)) {
          directionCount[key]++;
        }
      }
      
      return directionCount['1,0'] > 0 && directionCount['0,1'] > 0 && directionCount['1,1'] > 0;
    }

    function placeAllWordsWithVariety() {
      let attempts = 0;
      const maxAttempts = 10;
      
      do {
        board = Array(totalCells).fill(null);
        usedIndexes.clear();
        wordMap = {};
        
        let allPlaced = true;
        const shuffledWords = [...words].sort(() => Math.random() - 0.5);
        
        for (let word of shuffledWords) {
          if (!placeWord(word)) {
            allPlaced = false;
            break;
          }
        }
        
        if (allPlaced && checkDirectionVariety()) {
          return true;
        }
        
        attempts++;
      } while (attempts < maxAttempts);
      
      return false;
    }

    function placeClovers(count) {
      let placed = 0;
      let attempts = 0;
      while (placed < count && attempts < 1000) {
        const idx = Math.floor(Math.random() * totalCells);
        if (!usedIndexes.has(idx) && !clovers.has(idx) && !daisies.has(idx)) {
          if (isSafeForSpecial(idx)) {
            clovers.add(idx);
            placed++;
          }
        }
        attempts++;
      }
    }

    function placeDaisies(count) {
      let placed = 0;
      let attempts = 0;
      while (placed < count && attempts < 1000) {
        const idx = Math.floor(Math.random() * totalCells);
        if (!usedIndexes.has(idx) && !clovers.has(idx) && !daisies.has(idx)) {
          if (isSafeForSpecial(idx)) {
            daisies.add(idx);
            placed++;
          }
        }
        attempts++;
      }
    }

    function isSafeForSpecial(idx) {
      const x = idx % gridSize;
      const y = Math.floor(idx / gridSize);
      
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx;
          const ny = y + dy;
          if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
            const nIdx = ny * gridSize + nx;
            if (clovers.has(nIdx) || daisies.has(nIdx)) {
              return false;
            }
          }
        }
      }
      return true;
    }

    function fillEmptyCells() {
      const filler = '같갛개거건걸것게고괴교국궁그근금기긴까깜깨꺾껴꼼꽁꾸끔난내넘넣네놀놈누뉴는니님다닥대댄더던덩데도동두드득든듣들등디딜딱때땡똑뚫뛰라락란람랐랑래랜러레려력렸로롭르른를리린림마만맛맞맨머먼멀메멘며몰무묻뭘미민바받방버벅번봐봤부붙브블비빈빌빔빠빡빨빼뻥사새생서섭섰세숙쉬슴실싶쌍쓰씌씻아악알았애야어엄업없었엉에여열옛오온올와왔왜우울원위유윤으을음의익인잃있잊작잖잘저전제져좋주줬짜짝찍차착참창채척천청체쳤초출췄취치친카켜코콜크테토트튼폭핀하학한할해햄했행현호혼화환히희'.split('');
      shuffle(filler);
      let i = 0;
      for (let j = 0; j < totalCells; j++) {
        if (!board[j] && !clovers.has(j) && !daisies.has(j)) {
          board[j] = filler[i++ % filler.length];
        }
      }
    }

    function reveal(index) {
      if (revealed[index]) return;
      revealed[index] = true;
      const cell = gameEl.children[index];
      
      if (clovers.has(index)) {
        cell.textContent = '🍀';
        const directions = [-gridSize, gridSize, -1, 1];
        for (let d of directions) {
          const newIdx = index + d;
          if (newIdx >= 0 && newIdx < totalCells) {
            if (d === -1 || d === 1) {
              if (Math.floor(index / gridSize) === Math.floor(newIdx / gridSize)) {
                reveal(newIdx);
              }
            } else {
              reveal(newIdx);
            }
          }
        }
      } else if (daisies.has(index)) {
        cell.textContent = '🌼';
        const x = index % gridSize;
        const y = Math.floor(index / gridSize);
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx;
            const ny = y + dy;
            if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
              const nIdx = ny * gridSize + nx;
              if (!revealed[nIdx]) reveal(nIdx);
            }
          }
        }
      } else {
        cell.textContent = board[index];
      }
      cell.classList.add('revealed');
    }

    function updateScore() {
      const userScoreContent = `<h3>사용자:</h3><br>` + foundBy.user.map(w => `✓ ${w}`).join("<br>");
      const computerScoreContent = `<h3>컴퓨터:</h3><br>` + foundBy.computer.map(w => `✓ ${w}`).join("<br>");
      
      userScoreEl.innerHTML = userScoreContent;
      computerScoreEl.innerHTML = computerScoreContent;
      userScoreMobileEl.innerHTML = userScoreContent;
      computerScoreMobileEl.innerHTML = computerScoreContent;
    }

    function updateTurnDisplay() {
      if (resultShown) return;
      const name = currentPlayer === 'user' ? '사용자' : '컴퓨터';
      currentTurnEl.textContent = `${name}의 차례입니다.`;
    }

    function switchTurn(extra) {
      if (!extra) {
        currentPlayer = currentPlayer === 'user' ? 'computer' : 'user';
      }
      updateTurnDisplay();

      if (currentPlayer === 'computer' && !resultShown) {
        npcTimeoutId = setTimeout(() => {
          computerMove();
        }, 1000);
      }
    }

    function computerMove() {
      if (resultShown) return;
      
      const availableCells = [];
      for (let i = 0; i < totalCells; i++) {
        if (!revealed[i]) {
          availableCells.push(i);
        }
      }
      
      if (availableCells.length === 0) return;
      
      const randomIndex = Math.floor(Math.random() * availableCells.length);
      const selectedCell = availableCells[randomIndex];
      
      handleClick(selectedCell);
    }

    function handleClick(index) {
      if (revealed[index] || resultShown) return;

      const extra = clovers.has(index) || daisies.has(index);
      reveal(index);
      checkWords();
      checkGameEnd();

      if (!resultShown) {
        switchTurn(extra);
      }
    }

    function checkWords() {
      for (let word of Object.keys(wordMap)) {
        if (foundWords.has(word)) continue;
        const pos = wordMap[word].positions;
        if (pos.every(i => revealed[i])) {
          foundWords.add(word);
          foundBy[currentPlayer].push(word);
          pos.forEach(i => {
            const cell = gameEl.children[i];
            cell.classList.add(
              currentPlayer === 'user' ? 'word-owned-user' : 'word-owned-computer'
            );
          });
          updateScore();
        }
      }
    }

    function checkGameEnd() {
      const totalWords = Object.keys(wordMap).length;
      if (foundWords.size >= totalWords && totalWords > 0) {
        resultShown = true;

        if (npcTimeoutId) {
          clearTimeout(npcTimeoutId);
          npcTimeoutId = null;
        }

        const userWords = foundBy.user.length;
        const computerWords = foundBy.computer.length;

        let winner = '';
        if (userWords > computerWords) {
          winner = '사용자 승!';
        } else if (computerWords > userWords) {
          winner = '컴퓨터 승!';
        } else {
          winner = '무승부!';
        }

        currentTurnEl.textContent = `게임 종료! ${winner}`;

        setTimeout(() => {
          alert(`게임 종료!\n\n사용자: ${userWords}개\n컴퓨터: ${computerWords}개\n\n${winner}`);
        }, 500);
      }
    }

    retryBtn.onclick = () => {
      init();
    };
  </script>

</body>
</html>
